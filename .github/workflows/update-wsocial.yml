name: Update W Social snapshot

on:
  schedule:
    # Stündlich zur Minute 17 (UTC)
    - cron: "17 * * * *"

  # Ermöglicht einen manuellen Test
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-wsocial
  cancel-in-progress: true

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Create W Social snapshot
        run: node scripts/fetch-wsocial.mjs

      - name: Commit changed snapshot
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update W Social snapshot"
          file_pattern: "data/wsocial.json"